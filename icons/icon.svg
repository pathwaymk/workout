<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.25" stroke-dasharray="8 8" />

  <!-- Dumbbell Icon (Left weight plates, Bar, Right weight plates) -->
  <g transform="translate(256, 230) rotate(-45) translate(-256, -230)" filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="180" y="218" width="152" height="24" rx="12" fill="#e2e8f0" />
    <!-- Center knurling / grip -->
    <rect x="226" y="214" width="60" height="32" rx="6" fill="url(#primaryGrad)" />

    <!-- Left inner collar -->
    <rect x="170" y="206" width="12" height="48" rx="4" fill="#94a3b8" />
    <!-- Left inner large plate -->
    <rect x="142" y="170" width="24" height="120" rx="8" fill="url(#primaryGrad)" />
    <!-- Left outer small plate -->
    <rect x="116" y="190" width="22" height="80" rx="6" fill="url(#primaryGrad)" />
    <!-- Left bar cap -->
    <rect x="108" y="222" width="8" height="16" rx="3" fill="#cbd5e1" />

    <!-- Right inner collar -->
    <rect x="330" y="206" width="12" height="48" rx="4" fill="#94a3b8" />
    <!-- Right inner large plate -->
    <rect x="346" y="170" width="24" height="120" rx="8" fill="url(#primaryGrad)" />
    <!-- Right outer small plate -->
    <rect x="374" y="190" width="22" height="80" rx="6" fill="url(#primaryGrad)" />
    <!-- Right bar cap -->
    <rect x="396" y="222" width="8" height="16" rx="3" fill="#cbd5e1" />
  </g>

  <!-- Pulse / Heartbeat Line (Cardio symbol) across bottom -->
  <path d="M 96 380 L 170 380 L 205 340 L 235 430 L 275 320 L 305 400 L 335 380 L 416 380"
        fill="none"
        stroke="url(#accentGrad)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
